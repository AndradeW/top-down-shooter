<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top-Down Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Botón de sonido -->
  <button id="soundButton" title="Activar/desactivar sonido" aria-label="Activar o desactivar el sonido">🔊</button>

  <!-- HUD -->
  <div id="hud">
    <div id="score">Puntos: 0</div>
    <div id="wave">Oleada 1</div>
    <div id="level">Nivel 1</div>
    <div id="bars">
      <div id="healthBar"><div id="healthFill"></div></div>
      <div id="xpBar"><div id="xpFill"></div></div>
    </div>
  </div>

  <!-- Menú inicial -->
  <div id="menu" class="overlay">
    <h1 class="game-title">TOP-DOWN SHOOTER</h1>
    <ul class="controls-list">
      <li>Moverse: <b>WASD</b> o <b>flechas</b></li>
      <li>Apuntar: <b>ratón</b></li>
      <li>Disparar: <b>clic izquierdo</b></li>
    </ul>
    <p id="menuRecord" class="record hidden"></p>
    <button id="startButton" class="primary-btn">JUGAR</button>
    <p class="hint">o pulsa ENTER</p>
  </div>

  <!-- Game Over -->
  <div id="gameover" class="overlay hidden">
    <h1 class="game-title">GAME OVER</h1>
    <p id="finalScore" class="final-score">Puntos: 0</p>
    <p id="newRecord" class="record pulse hidden">¡NUEVO RÉCORD!</p>
    <div class="results-divider"></div>
    <div id="resultsStats">
      <p id="statTime"></p>
      <p id="statKills"></p>
      <p id="statLevel"></p>
      <p id="statBest"></p>
    </div>
    <button id="restartButton" class="primary-btn">REINICIAR</button>
    <p class="hint">o pulsa ENTER</p>
  </div>

  <!-- Selección de mejora -->
  <div id="upgrades" class="overlay hidden">
    <h1 class="game-title">¡NIVEL!</h1>
    <p class="subtitle">Elige una mejora</p>
    <div id="upgradeOptions"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
